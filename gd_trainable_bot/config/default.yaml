window:
  title_keywords:
    - "Geometry Dash"
  capture:
    top_ratio: 0.10
    bottom_ratio: 0.90
    left_ratio: 0.00
    right_ratio: 1.00
  frame_width: 160
  frame_height: 90

control:
  jump_key: "space"
  auto_focus_window: false
  emergency_stop_key: "f8"
  pause_resume_key: "f9"

runtime:
  fps_limit: 30
  tick_ms: 33
  startup_wait_seconds: 2

collection:
  attempts_per_run: 25
  save_every_n_frames: 3

training:
  test_split: 0.2
  random_state: 42
  max_depth: 12
  n_estimators: 200

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  checkpoints_dir: "checkpoints"
  logs_dir: "logs"
  models_dir: "models"
  stats_file: "data/processed/stats.json"
