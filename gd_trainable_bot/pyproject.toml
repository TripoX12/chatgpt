[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gd-trainable-bot"
version = "0.1.0"
description = "Bot entrenable para Geometry Dash basado en captura de pantalla + input simulado"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.8",
  "mss>=9.0",
  "pynput>=1.7",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "rich>=13.7",
]

[project.scripts]
gd-bot = "gd_trainable_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]
